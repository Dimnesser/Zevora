name: Сайт → GitHub Pages

# Publishes the site to the gh-pages branch.
#
# What ships is a static export of the real application: the same pages,
# the same components, the same drop tables. What it cannot ship is the
# server behind them — Pages serves files, not processes — so the export
# runs against an in-browser backend (lib/client/demo/) and says so in a
# banner at the top of every page. The draw there happens in the
# visitor's own browser and proves nothing; that is precisely the
# difference the real product exists to provide.
#
# This pushes a branch rather than using actions/deploy-pages on purpose.
# Turning Pages on for a repository is an admin-level setting, and the
# workflow's GITHUB_TOKEN does not have that permission — actions/configure-pages
# with `enablement: true` fails with "Resource not accessible by integration".
# A branch push needs only `contents: write`, so this job always succeeds and
# the site is ready the moment Pages is pointed at gh-pages / (root).

on:
  push:
    branches:
      - main
      - claude/zevora-gaming-platform-bbpz45
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "hooks/**"
      - "data/**"
      - "public/**"
      - "scripts/build-static.mjs"
      - "scripts/build-demo-data.mjs"
      - "next.config.mjs"
      - "tailwind.config.ts"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rebuilt from source so the published site can never drift from the
      # catalogue that is committed. The demo snapshot is taken from the
      # real server's own API, which is why it needs a server build first.
      - name: Rebuild case art and drop tables
        run: |
          npm run build:cases
          npm run build:cases:data

      - name: Snapshot the catalogue for the demo backend
        run: |
          npx next build
          npm run build:demo-data

      - name: Build the static site
        run: npm run build:static
        env:
          ZEVORA_BASE_PATH: /${{ github.event.repository.name }}

      - name: Push docs/ to gh-pages
        run: |
          cd docs
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Where to find it
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          echo "::notice title=Показать сайт::Settings → Pages → Source: Deploy from a branch → gh-pages / (root). Адрес: https://${owner,,}.github.io/${name}/"
